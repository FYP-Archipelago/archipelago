[project]
name = "archipelago"
version = "0.3.0"
description = "Clustering engine for distributed-EA runs, building island-aware search trajectory networks (STNs) live or after the run"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scikit-learn>=1.5", "pydantic>=2.8"]

[project.urls]
Repository = "https://github.com/FYP-Archipelago/archipelago"

[dependency-groups]
dev = ["pre-commit", "pytest", "ruff==0.17.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archipelago"]

[tool.ruff]
line-length = 150

[tool.pytest.ini_options]
testpaths = ["tests"]
